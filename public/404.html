<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Valeria Zuluaga</title>
    <script type="text/javascript">
        // Script de redirección para manejar rutas en GitHub Pages con React Router
        var pathSegmentsToKeep = 1; // Mantiene '/portfolio' en la URL
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.replace(/^\?/, '') : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
